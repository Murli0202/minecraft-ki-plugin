name: KiPlugin
version: 1.0
main: de.kibot.KiPlugin
api-version: 26.1
description: KI-Assistent im Chat via Ollama
author: Murli0202

commands:
  kireload:
    description: Lädt die KI-Plugin Config neu
    usage: /kireload
    permission: kiplugin.reload

  setaiserver:
    description: Setzt die lokale AI-Server URL (persistiert in config)
    usage: /setaiserver <url>
    permission: kiplugin.setaiserver

permissions:
  kiplugin.reload:
    description: Erlaubt das Neuladen der Config
    default: op

  kiplugin.setaiserver:
    description: Erlaubt das Ändern der lokalen AI-Server URL
    default: op
